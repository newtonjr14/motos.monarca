ktor:
  deployment:
    port: 8080
  application:
    startupTimeoutMillis: 60000
    modules:
      - com.monarca.HttpKt.configureHttp
      - com.monarca.SerializationKt.configureSerialization
      - com.monarca.StatusPagesKt.configureStatusPages
      - com.monarca.KoinKt.configureKoin
      - com.monarca.ResourcesKt.configureResources
      - com.monarca.HealthKt.configureHealth
      - com.monarca.auth.AuthKt.configureAuthentication
      - com.monarca.auth.http.AuthRoutingKt.configureAuthRoutes
      - com.monarca.localidade.http.LocalidadeRoutingKt.configureLocalidade
      - com.monarca.empresa.http.EmpresaRoutingKt.configureEmpresa
      - com.monarca.pessoa.http.PessoaRoutingKt.configurePessoa
      - com.monarca.usuario.http.UsuarioRoutingKt.configureUsuario
      - com.monarca.produto.http.ProdutoRoutingKt.configureProduto
      - com.monarca.produto.http.MarcaRoutingKt.configureMarca
      - com.monarca.estoque.http.EstoqueRoutingKt.configureEstoque
      - com.monarca.cotacao.http.CotacaoRoutingKt.configureCotacao
      - com.monarca.caixa.http.CaixaRoutingKt.configureCaixa
      - com.monarca.venda.http.VendaRoutingKt.configureVenda
      - com.monarca.seed.http.SeedDemoRoutingKt.configureSeed

database:
  url: "r2dbc:h2:mem:///localidade_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE"
  user: root
  password: ""

jwt:
  secret: "monarca-motos-test-secret-min-32-characters-long"
  issuer: "monarca-motos"
  audience: "monarca-motos-api"
  realm: "Monarca Motos"
  accessExpirationMinutes: 60
  refreshExpirationDays: 7

cotacao:
  exigirDoDia: false

seed:
  demo: true
  cidades: false
