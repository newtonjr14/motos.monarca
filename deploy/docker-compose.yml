name: monarca

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: monarca_motos_db
      POSTGRES_USER: monarca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monarca -d monarca_motos_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../motos-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./application.yaml:/config/application.yaml:ro
    restart: unless-stopped

volumes:
  pgdata:
