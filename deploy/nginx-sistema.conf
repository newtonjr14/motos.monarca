server {
    listen 80;
    listen [::]:80;
    server_name sistema.grupomonarca.com.br;

    root /var/www/sistema;
    index index.html;

    location ~ ^/(auth|health|paises|divisoes|cidades|pessoas|documentos-tipos|clientes|fornecedores|empresas|filiais|usuarios|produtos|marcas|modelos|estoques|cotacoes|finalizadores|caixas|meus-caixas|caixa-sessoes|caixa-movimentacoes|produto-chassis|vendas|devolucoes|titulos-receber|titulos-pagar|relatorio-parcelas-receber|relatorio-parcelas-pagar|baixas-receber|baixas-pagar|recebimentos|pagamentos|estoque-movimentos|entradas|facturas|seed|estoque-produtos)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
